gw:
  host: localhost
  port: 8001
  sendPort: 8001
  eventsPath: /events
  gatewayId: "!2687afb1"
channel: 2
dm:
  default: true
  fallbackChannel: 2
  omitAddress: false
logLevel: info
paths:
  store: ./payloads
  log: ./mtmesh.log
timing:
  sendSpacingMs: 3000
  replyTimeoutMs: 20000
  wsMaxPayload: 0
  chunkAnswerMs: 8000
  idleMs: 240000
  pushDeadlineMs: 900000
  pushQuietMs: 15000
# The config schema is a FILE generated at firmware build time from CONFIG_FIELDS
# (pac-garage-alarm/tools/gen_schema.py) and served instantly — it is STATIC per build and
# is NEVER pulled over the radio. The old over-air pull was 7 round trips at 30-90s each.
schema:
  file: /usr/share/pac/dev/pio/projects/pac-garage-alarm/docs/config-schema.json

# Command butler. maxPending is a HARD ceiling on UNDELIVERED commands per unit: nothing
# normal queues ten at one radio (the largest real backlog seen is 1), so hitting it means
# a caller is looping — treat it as a bug signal, not a limit to raise. Identical pending
# commands are collapsed before this ever applies.
butler:
  maxPending: 10
retry:
  commands: false
  idempotent: 2
  attemptTimeoutMs: 10000
listen:
  autoFetchImages: true
  alerts:
    - motion
    - fault
daemon:
  serve: false
  host: 127.0.0.1
  port: 8787
notify:
  transports:
    console:
      enabled: true
    email:
      enabled: false
      to: ""
    webhook:
      enabled: false
      url: ""
    whatsapp:
      enabled: false
  routes:
    motion:
      - console
    fault:
      - console
align:
  radios:
    omni: "!2687afb1"
    yagi: "!fa39f7b4"
# LABELS ENCODE LOCATION, so they must be toggled on every physical swap — exactly like the
# short name. They were inverted on 2026-07-25: 8cee336b went to the garage and b80f came to
# the bench, but only the short names and modes were switched. Verified against the reported
# positions: 8cee336b is 2.501 km from b80f on bearing 301.2 deg (garage -> house).
devices:
  "!8cee336b":
    label: Garage alarm
  "!987ab80f":
    label: Bench alarm
units:
  "!987ab80f":
    mode: dev
  "!8cee336b":
    mode: dev

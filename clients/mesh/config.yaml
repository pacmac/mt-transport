# mtmesh config — the ONLY place vars/paths/timings live. Override order:
# defaults(code) < this file < env(MTMESH_*) < CLI flags.
gw:
  host: localhost
  port: 8000            # node-dash proxy fronts send + events
  sendPort: 8000
  eventsPath: /events
  gatewayId: null       # REQUIRED for send — the BLE gateway node, e.g. "!2687afb1" (OMNI, channel 2)
channel: 2             # never 0 (PRIMARY)
logLevel: info         # silent|error|warn|info|debug|trace ; env MTMESH_LOG overrides
paths:
  store: ./payloads
  log:   ./mtmesh.log
timing:
  sendSpacingMs: 3000
  replyTimeoutMs: 20000
  wsMaxPayload: 0        # gateway opens with a multi-MB snapshot
  chunkAnswerMs: 8000
  idleMs: 240000
  pushDeadlineMs: 900000
  pushQuietMs: 15000     # post-stream quiet wait before PROGRESS_Q; must exceed the device's max inter-chunk gap (~9s). actMs(4s) < quietMs(15s) < push idle(35s)
retry:
  commands: false        # non-idempotent; no blind retry
listen:
  autoFetchImages: true
  alerts: [motion, fault]
daemon:
  serve: false          # opt-in read-only domain HTTP+WS surface (mtmesh listen --serve)
  host: 127.0.0.1       # loopback only by default
  port: 8787            # GET /health /nodes /nodes/:id ; WS /events (domain feed)
notify:
  transports:
    console:  { enabled: true }
    email:    { enabled: false, to: "" }
    webhook:  { enabled: false, url: "" }
    whatsapp: { enabled: false }
  routes:
    motion: [console]
    fault:  [console]

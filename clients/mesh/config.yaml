gw:
  host: localhost
  # mesh-gw DIRECT — raw REST + ws:8001/events, owns all BLE (device-comms.md:53).
  # NEVER route via node-dash (:8000): we must not depend on their service. node-dash may depend on
  # our libs; never the reverse. Was wrongly :8000 (node-dash proxy) — fixed 2026-07-24.
  port: 8001
  sendPort: 8001
  eventsPath: /events
  gatewayId: "!2687afb1"
channel: 2
dm:
  default: true
  fallbackChannel: 2
  omitAddress: false
logLevel: info
paths:
  store: ./payloads
  log: ./mtmesh.log
timing:
  sendSpacingMs: 3000
  replyTimeoutMs: 20000
  wsMaxPayload: 0
  chunkAnswerMs: 8000
  idleMs: 240000
  pushDeadlineMs: 900000
  pushQuietMs: 15000
retry:
  commands: false
  idempotent: 2
  attemptTimeoutMs: 10000
listen:
  autoFetchImages: true
  alerts:
    - motion
    - fault
daemon:
  serve: false
  host: 127.0.0.1
  port: 8787
notify:
  transports:
    console:
      enabled: true
    email:
      enabled: false
      to: ""
    webhook:
      enabled: false
      url: ""
    whatsapp:
      enabled: false
  routes:
    motion:
      - console
    fault:
      - console
# OUR alarm devices — the declared half of the device registry (GET /v1/mesh/devices).
# Keyed by node id; `label` is operator-facing only. Declaring a unit here keeps it in
# the device list while it is ASLEEP; the other half is learned from 260/261 traffic.
# The gateway (!2687afb1) is NOT listed: it is our radio, not one of our devices.
devices:
  "!8cee336b": { label: "Bench alarm" }
  "!987ab80f": { label: "Garage alarm" }
units:
  "!987ab80f":
    mode: dev
  "!8cee336b":
    mode: live

gw:
  host: localhost
  port: 8001
  sendPort: 8001
  eventsPath: /events
  gatewayId: "!2687afb1"
channel: 2
dm:
  default: true
  fallbackChannel: 2
  omitAddress: false
logLevel: info
paths:
  store: ./payloads
  log: ./mtmesh.log
timing:
  sendSpacingMs: 3000
  replyTimeoutMs: 20000
  wsMaxPayload: 0
  chunkAnswerMs: 8000
  idleMs: 240000
  pushDeadlineMs: 900000
  pushQuietMs: 15000
# Command butler. maxPending is a HARD ceiling on UNDELIVERED commands per unit: nothing
# normal queues ten at one radio (the largest real backlog seen is 1), so hitting it means
# a caller is looping — treat it as a bug signal, not a limit to raise. Identical pending
# commands are collapsed before this ever applies.
butler:
  maxPending: 10
retry:
  commands: false
  idempotent: 2
  attemptTimeoutMs: 10000
listen:
  autoFetchImages: true
  alerts:
    - motion
    - fault
daemon:
  serve: false
  host: 127.0.0.1
  port: 8787
notify:
  transports:
    console:
      enabled: true
    email:
      enabled: false
      to: ""
    webhook:
      enabled: false
      url: ""
    whatsapp:
      enabled: false
  routes:
    motion:
      - console
    fault:
      - console
align:
  radios:
    omni: "!2687afb1"
    yagi: "!fa39f7b4"
devices:
  "!8cee336b":
    label: Bench alarm
  "!987ab80f":
    label: Garage alarm
units:
  "!987ab80f":
    mode: dev
  "!8cee336b":
    mode: dev

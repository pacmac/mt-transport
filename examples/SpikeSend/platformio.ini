; SpikeSend — the one-hour gate from docs/spike.md.
;
; A bare RadioLib sketch that transmits ONE Meshtastic-compatible encrypted
; packet. Pass = a stock Meshtastic node on the same channel decodes it and
; shows it in its NodeDB. The mt-transport library does not get written until
; this passes.
;
; Copy secrets.h.example to secrets.h first (gitignored).
;
; PHY/init values mirror the reference firmware exactly:
;   begin(869.525, 250, SF11, CR5, 0x2b, power, preamble 16, TCXO 1.8V, LDO off)
;   setCurrentLimit(140) / setDio2AsRfSwitch(true) / setCRC(on)

[env:rak4631]
platform = nordicnrf52
board = wiscore_rak4631
framework = arduino
; PIO's bundled Adafruit nRF52 core has no RAK4631 variant — board def and
; variant files are vendored from the reference firmware (boards/, variants/).
board_build.variants_dir = variants
lib_deps =
    jgromes/RadioLib@^7.1.2
    nanopb/Nanopb@^0.4.9
    operatorfoundation/Crypto@^0.4.0 ; rweather arduinolibs — same CTR<AES128> the reference firmware uses
build_flags =
    -Isrc/generated
    -I.

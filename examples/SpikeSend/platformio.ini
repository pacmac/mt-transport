; SpikeSend — the passing spike (docs/spike.md), now consuming the
; mt-transport library the same way a real application will:
;   lib_deps = symlink://<path-to-mt-transport>
;
; Copy secrets.h.example to secrets.h first (gitignored).

[env:rak4631]
platform = nordicnrf52
board = wiscore_rak4631
framework = arduino
; PIO's bundled Adafruit nRF52 core has no RAK4631 board or variant — both are
; vendored here (boards/, variants/), not shipped with the library.
board_build.variants_dir = variants
lib_deps =
    symlink://../..
build_flags =
    -I.

; SpikeSend — the one-hour gate from docs/spec.md §THE SPIKE.
;
; A bare RadioLib sketch that transmits ONE Meshtastic-compatible encrypted
; packet. Pass = a stock Meshtastic node on the same channel decodes it and
; shows it in its NodeDB. The mt-transport library does not get written until
; this passes.
;
; Stub only — main.cpp arrives with the spike task. Copy secrets.h.example to
; secrets.h first.

[env:rak4631]
platform = nordicnrf52
board = wiscore_rak4631
framework = arduino
lib_deps =
    jgromes/RadioLib
